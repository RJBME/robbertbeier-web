collections_config:
  charging:
    path: _data/charging.yml
    parser: yaml
    name: Charging Sessions
    icon: ev_station
    # We remove 'schemas' from here because it's a data file, not a folder of files.

# Tell CloudCannon how to edit the items INSIDE the data file:
_inputs:
  charging:
    type: array
    options:
      empty_type: default
    structures:
      _structures:
        values:
          - value:
              date: ''
              location: ''
              energy_kwh: 0.0
              cost: 0.0
              notes: ''

  location:
    type: select
    options:
      values: [Home, Work, Tesla, ChargePoint, Rivian]