collections_config:
  charging:
    path: _data/charging.yml
    name: Charging Sessions
    icon: ev_station
    # This disables the WYSIWYG text editor
    _editables:
      content: false

# This defines the form layout for adding a NEW entry
_inputs:
  date:
    type: date
  location:
    type: select
    options:
      values:
        - Home
        - Work
        - "Tesla, Lansing"
        - "Tesla, Ohio"
        - "Tesla, Battle Creek"
        - "ChargePoint, Muskegon"
        - "ChargePoint, Clare, MI"
        - "ChargePoint, Grand Rapids, MI"
        - "ChargePoint, DIA, Detroit"
        - "Rivian, Clare, MI"
        - "MGM Grand, Detroit, MI"
        - "Blink, BJ's Wholesale, Canton"
        - "Paul & Carol's, Beulah, MI"
  energy_kwh:
    type: number
  cost:
    type: number
  notes:
    type: textarea