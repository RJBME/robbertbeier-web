collections_config:
  charging:
    path: _charging
    name: Charging Sessions
    icon: ev_station
    create:
      extra_data:
        filename: '{date|year}-{date|month}-{date|day}'
      path: '[relative_base_path]/{filename}[count].md'
    schemas:
      default:
        path: .cloudcannon/schemas/charging.md
    _editables:
      content: false
    add_options:
      - name: Add Charging Session
        schema: default

_inputs:
  date:
    type: date
    required: true
    comment: "The session date (plug-OUT date; for an overnight charge that's the day AFTER start_date). New entries pre-fill a placeholder date so a forgotten date can't break the build — ALWAYS change it to the real charge date. Never leave this blank."
    options:
      time_format: false
      timezone: America/New_York
  location:
    type: select
    required: true
    comment: "REQUIRED — where you charged. Home/Work get special cost handling."
    options:
      values:
        - Home
        - Work
        - "Tesla, Lansing"
        - "Tesla, Blue Heron Service Plaza, Genoa, OH"
        - "Tesla, North Canton, OH"
        - "Tesla, Wyondot Plaza, Genoa, OH"
        - "Tesla, Battle Creek"
        - "Tesla, Brighton, MI"
        - "Tesla, Stevensville, MI"
        - "Tesla, Des Plains, IL"
        - "Tesla, The Arboretum, South Barrington, IL"
        - "Tesla, South Livingston, Madison, WI"
        - "Tesla, Tomah, WI"
        - "Tesla, Menomonie, WI"
        - "Tesla, Bloomington, MN"
        - "Tesla, Janesville, WI"
        - "Tesla, Culver's, Chicago, IL"
        - "ChargePoint, Muskegon"
        - "ChargePoint, Clare, MI"
        - "ChargePoint, BP Gas Station, Grand Rapids, MI"
        - "ChargePoint, DIA, Detroit"
        - "ChargePoint, UW Lot 46, Madison, WI"
        - "ChargePoint, Brewery Creek, Traverse City, MI"
        - "ChargePoint, Mason Street, Charlevoix, MI"
        - "Electrify America, Cadillac, MI"
        - "Electrify America, Lansing, MI"
        - "Electrify America, Grand Rapids, MI"
        - "WeCharge, Bridgeport, MI"
        - "Rivian, Clare, MI"
        - "MGM Grand, Detroit, MI"
        - "Blink, BJ's Wholesale, Canton"
        - "Paul & Carol's, Beulah, MI"
        - "Cabin"
        - "Rooted, Mancelona, MI"
  energy_kwh:
    type: number
    comment: "Energy added in kWh. For public DC fast charging, use the network's DELIVERED/billed kWh (what you paid for — drives cost & CO₂). For home/other, the Ford app battery-side number."
  battery_kwh:
    type: number
    comment: "OPTIONAL. Only for public DC fast charging where it differs from energy_kwh: the Ford app 'energy added' (battery-side). Used ONLY for mi/kWh efficiency. Leave blank/0 otherwise — efficiency then uses energy_kwh."
  vehicle:
    type: select
    options:
      values:
        - "2025 Mach-E GT"
        - "2026 Mach-E SR"
        - "LRB's 2025 Mach-E GT"
        - "LRB's 2026 Mach-E SR"
  cost:
    type: number
    comment: "Total cost in USD. Enter 0 for free sessions (Work, free public). Home cost is calculated automatically."
  solar:
    type: switch
    label: "Solar (zero-emission)"
    comment: "On = charged on solar/renewable power → counts as zero grid CO₂ for this session only. Leave OFF for normal grid charging, including regular Work."
  start_date:
    type: date
    label: "Charge Start Date"
    comment: "Date charging began — often the day before for overnight charges"
    options:
      time_format: false
      timezone: America/New_York
  start_time:
    type: text
    label: "Charge Start Time"
    comment: "Time charging began, 24h format HH:MM (e.g. 22:15)"
  end_time:
    type: text
    label: "Charge End Time"
    comment: "Time charging ended, 24h format HH:MM (e.g. 06:45)"
  soc_start:
    type: number
    label: "SOC at Plug-in (%)"
    comment: "Battery % when you plugged in"
  soc_end:
    type: number
    label: "SOC at Unplug (%)"
    comment: "Battery % when you unplugged"
  soc_added:
    type: number
    label: "SOC Added (%)"
    comment: "Total % added as reported by FordPass"
  miles_added:
    type: number
    label: "Miles Added"
    comment: "Miles added this session as reported by FordPass"
  notes:
    type: textarea
