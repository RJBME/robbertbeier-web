# Disable collections for the data file to stop the "New File" behavior
collections_config: {}

# Define how the data file should be edited
data_config:
  charging:
    path: _data/charging.yml
    
    _structures:
      charging_items:
        values:
          - value:
              date: ''
              location: ''
              energy_kwh: 0.0
              cost: 0.0
              notes: null

    _options:
      empty_type: default

_inputs:
  charging:
    options:
      start_collapsed: true
      preview:
        text: "{date} - {location}"
  date:
    type: date
  location:
    type: select
    options:
      values:
        - Home
        - Work
        - "Tesla, Lansing"
        - "Tesla, Ohio"
        - "Tesla, Battle Creek"
        - "ChargePoint, Muskegon"
        - "ChargePoint, Clare, MI"
        - "ChargePoint, Grand Rapids, MI"
        - "ChargePoint, DIA, Detroit"
        - "Rivian, Clare, MI"
        - "MGM Grand, Detroit, MI"
        - "Blink, BJ's Wholesale, Canton"
        - "Paul & Carol's, Beulah, MI"
  energy_kwh:
    type: number
  cost:
    type: number
  notes:
    type: textarea