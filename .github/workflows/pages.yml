# Build & deploy the site via GitHub Actions instead of the default branch build.
# Why: the default Pages build fails the ENTIRE site if any _charging/*.md has a
# blank `date:` (e.g. a session logged via CloudCannon before the date was set).
# This workflow runs a sanitize step first so a missing date is filled in (from
# start_date / filename) before Jekyll builds — the build can no longer be taken
# down by a blank date.
#
# ⚙️  ONE-TIME ACTIVATION: Settings → Pages → "Build and deployment" →
#     Source → "GitHub Actions". (Reversible anytime by switching back to
#     "Deploy from a branch".)
name: Build & deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; don't cancel in-progress deploys.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sanitize charging session dates
        run: python3 .github/scripts/sanitize_charging_dates.py

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production
          PAGES_REPO_NWO: ${{ github.repository }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
