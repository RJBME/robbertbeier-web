---
layout: default
---
<article style="max-width: 800px; margin: 0 auto;">
  <h1 style="color: var(--post-title);">{{ page.title }}</h1>
  <p style="color: var(--post-meta); font-size: 0.9rem;">{{ page.date | date: "%B %-d, %Y" }}</p>

  <div class="post-content" style="color: var(--post-body); margin-bottom: 30px; line-height: 1.75;">
    {{ content }}
  </div>

  {% if page.images %}
    <hr style="border: 0; border-top: 1px solid var(--post-hr); margin: 40px 0;">
    <h3 style="color: var(--post-title);">Post Gallery</h3>
    <div class="post-specific-gallery" style="display: flex; flex-direction: column; gap: 20px; margin-top: 16px;">
      {% for img in page.images %}
        <img src="{{ img }}"
             style="width: 100%; max-width: 700px; height: auto; border-radius: 6px; display: block; margin: 0 auto; cursor: pointer;">
      {% endfor %}
    </div>
  {% endif %}

  <p style="margin-top: 50px; border-top: 1px solid var(--post-hr); padding-top: 20px;">
    <a href="/" style="color: #007aff; font-weight: bold;">← Back to Timeline</a>
  </p>
</article>
