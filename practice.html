<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Michigan SOS Practice Test</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
            background: #f4f7f6; 
            color: #333; 
            display: flex; 
            justify-content: center; 
            padding: 20px; 
        }
        .quiz-container { 
            background: white; 
            padding: 30px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
            max-width: 600px; 
            width: 100%; 
        }
        h1 { font-size: 1.5rem; text-align: center; margin-bottom: 10px; }
        .progress-text { 
            text-align: center; 
            color: #666; 
            margin-bottom: 10px; 
            font-size: 0.9rem; 
        }
        .progress-bar-container {
            width: 100%;
            height: 10px;
            background-color: #e0e0e0;
            border-radius: 5px;
            margin-bottom: 25px;
            overflow: hidden;
        }
        .progress-bar-fill {
            height: 100%;
            background-color: #4CAF50;
            width: 0%;
            transition: width 0.3s ease;
        }
        .question { font-size: 1.2rem; font-weight: bold; margin-bottom: 15px; }
        .options { display: flex; flex-direction: column; gap: 10px; }
        .option { 
            padding: 12px 15px; 
            border: 2px solid #e0e0e0; 
            border-radius: 8px; 
            cursor: pointer; 
            transition: all 0.2s; 
        }
        .option:hover { background: #f0f0f0; }
        .option.correct { border-color: #4CAF50; background: #e8f5e9; }
        .option.wrong { border-color: #F44336; background: #ffebee; }
        .btn { 
            background: #0056b3; 
            color: white; 
            border: none; 
            padding: 12px 20px; 
            border-radius: 8px; 
            font-size: 1rem; 
            cursor: pointer; 
            margin-top: 20px; 
            width: 100%; 
            display: none; 
        }
        .btn:hover { background: #004494; }
        
        /* Stats Screen Styles */
        .score-board { display: none; }
        .score-header { text-align: center; font-size: 1.5rem; margin-bottom: 20px; font-weight: bold;}
        .stats-container { margin-top: 20px; }
        .stat-row { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 10px; 
            border-bottom: 1px solid #eee;
            font-size: 0.95rem;
        }
        .stat-category { font-weight: bold; }
        .stat-badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            color: white;
            font-weight: bold;
        }
        .badge-good { background-color: #4CAF50; }
        .badge-review { background-color: #F44336; }
    </style>
</head>
<body>

<div class="quiz-container">
    <h1 id="main-title">SOS Practice Test</h1>
    
    <div id="progress-section">
        <div class="progress-text" id="progress-text">Question 1 of X</div>
        <div class="progress-bar-container">
            <div class="progress-bar-fill" id="progress-fill"></div>
        </div>
    </div>

    <div id="quiz-block">
        <div class="question" id="question-text">Loading question...</div>
        <div class="options" id="options-container"></div>
        <button class="btn" id="next-btn">Next Question</button>
    </div>
    
    <div class="score-board" id="score-board">
        <div class="score-header">Test Complete!</div>
        <div style="text-align: center; font-size: 1.2rem; margin-bottom: 10px;">
            Overall Score: <span id="score">0</span> / <span id="total">0</span> (<span id="score-percent">0</span>%)
        </div>
        
        <h3 style="margin-top: 30px; border-bottom: 2px solid #eee; padding-bottom: 5px;">Study Areas Breakdown</h3>
        <div class="stats-container" id="stats-container">
            <!-- Dynamic stats will populate here -->
        </div>

        <button class="btn" id="restart-btn" style="display: block; margin-top: 30px;">Restart Quiz</button>
    </div>
</div>

<script>
    // 📝 The Data Base (Categorized)
    const quizData = [
        // --- PREVIOUS QUESTIONS ---
        { category: "Rules & Licensing", question: "* A Michigan driver's license is issued and regulated by?", options: ["The federal government", "The county", "The state", "The local police department"], answer: 2 },
        { category: "Rules & Licensing", question: "After passing state licensing requirements, a driver is a ____ driver.", options: ["probationary", "beginner", "certified", "advanced"], answer: 1 },
        { category: "Rules & Licensing", question: "* For your level one license, your driving coach must be at least how old?", options: ["18 and have a license", "21 and have a license", "25 and have a license", "21, with or without a license"], answer: 1 },
        { category: "Safety & Pre-Driving", question: "Risk is the chance of injury, damage, loss, and:", options: ["delays", "citations", "death", "traffic"], answer: 2 },
        { category: "Safety & Pre-Driving", question: "It is important to decide how to manage available time, space, and ____ risk.", options: ["minimize", "eliminate", "ignore", "increase"], answer: 0 },
        { category: "Safety & Pre-Driving", question: "What is the largest reason for young drivers having fatal crashes?", options: ["Distracted driving", "Speeding", "Driving under the influence", "Lack of driving experience"], answer: 3 },
        { category: "Safety & Pre-Driving", question: "When doing pre-driving checks, you should check each tire for proper:", options: ["alignment", "tread wear", "inflation", "rotation"], answer: 2 },
        { category: "Safety & Pre-Driving", question: "* With a parallel parked vehicle, from which direction do you approach to enter the vehicle?", options: ["The back", "The front", "The passenger's side", "It doesn't matter"], answer: 1 },
        { category: "Vehicle Control", question: "* What is the most important part of your vehicle?", options: ["The engine", "The brakes", "The tires", "The steering wheel"], answer: 2 },
        { category: "Vehicle Control", question: "Before starting the engine, ensure the gear selector is in:", options: ["Neutral", "Drive", "Park", "Reverse"], answer: 2 },
        { category: "Safety & Pre-Driving", question: "* Is a child under the age of 4 ever allowed to sit in the front seat?", options: ["No, never", "Yes, always", "Yes, if the airbag is turned off AND all rear seats are occupied by children under age 4", "Yes, if they are in a forward-facing car seat"], answer: 2 },
        { category: "Safety & Pre-Driving", question: "Children under the age of ____ and less than 4'9\" must be secured in a child restraint system.", options: ["4 years old", "6 years old", "8 years old", "10 years old"], answer: 2 },
        { category: "Safety & Pre-Driving", question: "Your vehicle's outside mirrors should be adjusted in a way that the blind spots are:", options: ["reduced", "eliminated", "expanded", "visible"], answer: 0 },
        { category: "Safety & Pre-Driving", question: "* When is the best time to adjust your mirrors?", options: ["Before you adjust your seat", "After you adjust your seat", "While you are driving", "Before you put your seatbelt on"], answer: 1 },
        { category: "Safety & Pre-Driving", question: "* An advantage of using the enhanced mirror setting is the amount you have to move your head or shoulders is greatly:", options: ["increased", "reduced", "eliminated", "unchanged"], answer: 1 },
        { category: "Safety & Pre-Driving", question: "How many blind zones does a vehicle have?", options: ["2", "4", "6", "8"], answer: 1 },
        { category: "Vehicle Control", question: "What is the first action you should take if the accelerator sticks, and you need to stop quickly?", options: ["Turn off the ignition", "Pull the parking brake", "Pump the gas pedal", "Shift into Neutral and apply the brakes"], answer: 3 },
        { category: "Safety & Pre-Driving", question: "* What are emergency flashers used for?", options: ["To signal a turn", "To warn other drivers of a problem", "To indicate you are parking", "To drive faster in rain"], answer: 1 },
        { category: "Safety & Pre-Driving", question: "* If the red parking brake light is on, what does this indicate?", options: ["Your brakes are failing", "Your parking brake is activated", "You need brake fluid", "Your brake lights are out"], answer: 1 },
        { category: "Safety & Pre-Driving", question: "* What would be an indication if an airbag is not in proper operating condition?", options: ["The steering wheel will lock", "The horn will not work", "The airbag warning light will stay on", "The check engine light will flash"], answer: 2 },
        { category: "Safety & Pre-Driving", question: "* What is the #1 safety device?", options: ["Air bags", "Anti-lock brakes", "Seat belts", "Head restraints"], answer: 2 },
        { category: "Safety & Pre-Driving", question: "* How should you be seated to provide maximum protection?", options: ["Leaning slightly forward", "Straight up with your back firmly against the seat", "Reclined comfortably", "Shifted toward the center console"], answer: 1 },
        { category: "Safety & Pre-Driving", question: "* Correctly adjusted head restraints provide the most protection when a vehicle is struck from where?", options: ["The front", "The side", "The rear", "During a rollover"], answer: 2 },
        { category: "Safety & Pre-Driving", question: "* When driving a vehicle with airbags, what is the recommended distance you should be from the steering wheel?", options: ["Minimum 5\" away", "Minimum 10\" away", "Minimum 15\" away", "Minimum 20\" away"], answer: 1 },
        
        // --- NEW QUESTIONS FROM IMAGES 8685 - 8689 ---
        { category: "Maneuvers & Turning", question: "When should you brake when on a sharp curve?", options: ["Before entering the curve", "While in the middle of the curve", "As you exit the curve", "You should not brake, only coast"], answer: 0 },
        { category: "Maneuvers & Turning", question: "To turn left from a one-way street, you should do it from the ____ lane.", options: ["right", "center", "left", "any available"], answer: 2 },
        { category: "Vehicle Control", question: "* Which foot is used to control the pedals?", options: ["Left", "Right", "Both", "Left for brake, Right for gas"], answer: 1 },
        { category: "Vehicle Control", question: "When accelerating, where does the weight of the car shift to?", options: ["Towards the front", "Towards the back", "To the left side", "To the right side"], answer: 1 },
        { category: "Vehicle Control", question: "Proper braking requires the ____ of your foot to be on the pedal.", options: ["heel", "arch", "ball", "toes"], answer: 2 },
        { category: "Parking & Backing Up", question: "If you are backing up and want the rear of the vehicle to go left, be aware that the front of the vehicle:", options: ["stays stationary", "swings in the same direction", "swings in the opposite direction", "moves straight back"], answer: 2 },
        { category: "Parking & Backing Up", question: "* When steering in reverse, vehicle movement is how much greater?", options: ["2 times", "5 times", "10 times", "It is the same"], answer: 2 },
        { category: "Parking & Backing Up", question: "* What is the best way to avoid 'door dings' when parking?", options: ["Park far away", "Open your door slowly", "Park next to small cars", "Leave your windows down"], answer: 1 },
        { category: "Parking & Backing Up", question: "* When preparing to parallel park, how far should you position your vehicle from the vehicle you will park behind?", options: ["6 to 12 inches", "2 to 3 feet away", "4 to 5 feet away", "Right next to their mirror"], answer: 1 },
        { category: "Parking & Backing Up", question: "* Turn your wheels left when you park which way?", options: ["Facing uphill with a curb", "Facing downhill with a curb", "Facing uphill without a curb", "Facing downhill without a curb"], answer: 0 },
        { category: "Signs & Signals", question: "Traffic control devices serve what purpose?", options: ["To generate revenue", "To promote safety", "To decorate the roads", "To suggest routes"], answer: 1 },
        { category: "Signs & Signals", question: "* An example of a regulatory sign is a ____ sign.", options: ["School Zone", "Speed Limit", "Hospital", "Construction ahead"], answer: 1 },
        { category: "Signs & Signals", question: "* An example of a warning sign is a ____ sign.", options: ["Stop", "Yield", "School Zone", "Speed Limit"], answer: 2 },
        { category: "Signs & Signals", question: "What does a flashing red light mean?", options: ["Yield to oncoming traffic", "It is like a stop sign; stop behind the line", "Slow down and proceed with caution", "The intersection is closed"], answer: 1 },
        { category: "Signs & Signals", question: "* What does a Solid Yellow Arrow mean?", options: ["The light will be red soon", "You have the right of way", "Speed up to clear the intersection", "Oncoming traffic has a red light"], answer: 0 },
        { category: "Signs & Signals", question: "* What does a Flashing Yellow Arrow mean?", options: ["Stop immediately", "Time to claim the intersection", "You must go straight only", "The signal is broken"], answer: 1 },
        { category: "Signs & Signals", question: "If a traffic signal is not working at an intersection, what should you do?", options: ["Follow the car in front of you", "Honk your horn and proceed", "Come to a complete stop, then proceed when it is safe", "Treat it as a yield sign"], answer: 2 }
    ];

    // Tracking objects
    let currentQuestionIndex = 0;
    let score = 0;
    let categoryStats = {};

    // DOM Elements
    const questionText = document.getElementById('question-text');
    const optionsContainer = document.getElementById('options-container');
    const nextBtn = document.getElementById('next-btn');
    const progressText = document.getElementById('progress-text');
    const progressFill = document.getElementById('progress-fill');
    const progressSection = document.getElementById('progress-section');
    const quizBlock = document.getElementById('quiz-block');
    const scoreBoard = document.getElementById('score-board');
    const statsContainer = document.getElementById('stats-container');
    const restartBtn = document.getElementById('restart-btn');

    // Array Shuffling Function
    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
    }

    function initQuiz() {
        currentQuestionIndex = 0;
        score = 0;
        
        // Reset category stats dynamically based on the current array
        categoryStats = {};
        quizData.forEach(q => {
            if (!categoryStats[q.category]) {
                categoryStats[q.category] = { total: 0, correct: 0 };
            }
            categoryStats[q.category].total++;
        });

        quizBlock.style.display = 'block';
        progressSection.style.display = 'block';
        scoreBoard.style.display = 'none';
        
        shuffleArray(quizData);
        loadQuestion();
    }

    function loadQuestion() {
        nextBtn.style.display = 'none';
        const currentQ = quizData[currentQuestionIndex];
        
        // Update Text
        questionText.textContent = currentQ.question;
        progressText.textContent = `Question ${currentQuestionIndex + 1} of ${quizData.length}`;
        
        // Update Progress Bar
        const progressPercentage = ((currentQuestionIndex) / quizData.length) * 100;
        progressFill.style.width = `${progressPercentage}%`;

        // Clear and load options
        optionsContainer.innerHTML = '';
        currentQ.options.forEach((option, index) => {
            const div = document.createElement('div');
            div.className = 'option';
            div.textContent = option;
            div.onclick = () => selectOption(div, index, currentQ.answer, currentQ.category);
            optionsContainer.appendChild(div);
        });
    }

    function selectOption(selectedDiv, selectedIndex, correctIndex, category) {
        const allOptions = optionsContainer.children;
        for (let i = 0; i < allOptions.length; i++) {
            allOptions[i].onclick = null; // Disable clicks
            if (i === correctIndex) {
                allOptions[i].classList.add('correct');
            }
        }

        if (selectedIndex === correctIndex) {
            score++;
            categoryStats[category].correct++;
        } else {
            selectedDiv.classList.add('wrong');
        }

        nextBtn.style.display = 'block';
    }

    nextBtn.onclick = () => {
        currentQuestionIndex++;
        if (currentQuestionIndex < quizData.length) {
            loadQuestion();
        } else {
            showScore();
        }
    };

    function showScore() {
        progressFill.style.width = '100%';
        quizBlock.style.display = 'none';
        progressSection.style.display = 'none';
        scoreBoard.style.display = 'block';
        
        document.getElementById('score').textContent = score;
        document.getElementById('total').textContent = quizData.length;
        document.getElementById('score-percent').textContent = Math.round((score / quizData.length) * 100);

        // Build the Category Breakdown HTML
        statsContainer.innerHTML = '';
        
        for (const [category, stats] of Object.entries(categoryStats)) {
            const percentage = Math.round((stats.correct / stats.total) * 100);
            
            // Determine styling based on score (75% is passing threshold)
            let badgeClass = percentage >= 75 ? 'badge-good' : 'badge-review';
            let badgeText = percentage >= 75 ? 'Great Job' : 'Needs Review';

            const statRow = document.createElement('div');
            statRow.className = 'stat-row';
            statRow.innerHTML = `
                <div>
                    <div class="stat-category">${category}</div>
                    <div style="color: #666; font-size: 0.8rem;">${stats.correct} / ${stats.total} correct (${percentage}%)</div>
                </div>
                <div class="stat-badge ${badgeClass}">${badgeText}</div>
            `;
            statsContainer.appendChild(statRow);
        }
    }

    restartBtn.onclick = () => {
        initQuiz();
    };

    // Start the app
    initQuiz();
</script>
</body>
</html>
