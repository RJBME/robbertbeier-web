<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="SOS Practice">
    <meta name="theme-color" content="#0056b3">
    <title>Michigan SOS Practice Test</title>
    <style>
        html { -webkit-text-size-adjust: 100%; }
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f4f7f6;
            color: #333;
            display: flex;
            justify-content: center;
            margin: 0;
            padding: 20px;
            padding-left: max(20px, env(safe-area-inset-left));
            padding-right: max(20px, env(safe-area-inset-right));
            padding-bottom: max(20px, env(safe-area-inset-bottom));
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        .quiz-container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 600px;
            width: 100%;
        }
        h1 { font-size: 1.5rem; text-align: center; margin: 0 0 10px; }

        /* Splash Screen Styles */
        #splash-screen { text-align: center; }
        .splash-desc { color: #666; margin-bottom: 30px; font-size: 1.1rem; }
        .btn-large {
            display: block;
            width: 100%;
            margin-bottom: 6px;
            padding: 16px;
            font-size: 1.1rem;
            background: #fff;
            color: #0056b3;
            border: 2px solid #0056b3;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.15s;
        }
        .btn-large:active { transform: scale(0.99); background: #eef4fb; }
        .btn-highlight { background: #0056b3; color: white; font-weight: bold; }
        .btn-highlight:active { background: #004494; }
        .best-label {
            font-size: 0.8rem;
            color: #4CAF50;
            font-weight: bold;
            margin-bottom: 15px;
            min-height: 1em;
        }
        .splash-tools { margin-top: 20px; }
        .link-btn {
            background: none;
            border: none;
            color: #999;
            text-decoration: underline;
            cursor: pointer;
            font-size: 0.85rem;
            padding: 8px;
        }

        /* Quiz Styles */
        #quiz-block, #progress-section, #score-board { display: none; }

        .progress-text {
            text-align: center;
            color: #666;
            margin-bottom: 10px;
            font-size: 0.9rem;
        }
        .progress-bar-container {
            width: 100%;
            height: 10px;
            background-color: #e0e0e0;
            border-radius: 5px;
            margin-bottom: 25px;
            overflow: hidden;
        }
        .progress-bar-fill {
            height: 100%;
            background-color: #4CAF50;
            width: 0%;
            transition: width 0.3s ease;
        }

        .question { font-size: 1.2rem; font-weight: bold; margin-bottom: 15px; line-height: 1.35; }
        .options { display: flex; flex-direction: column; gap: 10px; }
        .option {
            padding: 14px 15px;
            min-height: 48px;
            display: flex;
            align-items: center;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s;
            user-select: none;
            -webkit-user-select: none;
        }
        .option:active { background: #ececec; }
        .option.answered { cursor: default; }
        .option.answered:active { background: #fff; }
        .option.correct { border-color: #4CAF50; background: #e8f5e9; }
        .option.wrong { border-color: #F44336; background: #ffebee; }

        .explanation-box {
            display: none;
            margin-top: 15px;
            padding: 12px 15px;
            background: #f0f6ff;
            border-left: 4px solid #0056b3;
            border-radius: 6px;
            font-size: 0.95rem;
            line-height: 1.4;
            color: #333;
        }
        .explanation-box strong { color: #0056b3; }

        .btn-next {
            background: #0056b3;
            color: white;
            border: none;
            padding: 14px 20px;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 20px;
            width: 100%;
            display: none;
        }
        .btn-next:active { background: #004494; }

        .btn-secondary {
            background: #fff;
            color: #666;
            border: 2px solid #ccc;
            padding: 14px 20px;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 10px;
            width: 100%;
            display: none;
        }
        .btn-secondary:active { background: #eee; }

        /* Stats Screen Styles */
        .score-header { text-align: center; font-size: 1.5rem; margin-bottom: 20px; font-weight: bold; }
        .section-heading {
            margin-top: 30px;
            margin-bottom: 0;
            border-bottom: 2px solid #eee;
            padding-bottom: 5px;
            font-size: 1.1rem;
        }
        .stats-container { margin-top: 10px; }
        .stat-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            padding: 10px 0;
            border-bottom: 1px solid #eee;
            font-size: 0.95rem;
        }
        .stat-category { font-weight: bold; }
        .stat-badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            color: white;
            font-weight: bold;
            white-space: nowrap;
        }
        .badge-good { background-color: #4CAF50; }
        .badge-review { background-color: #F44336; }

        /* Mini-Test Review Button */
        .btn-mini {
            background: white;
            color: #F44336;
            border: 1px solid #F44336;
            padding: 6px 10px;
            border-radius: 4px;
            font-size: 0.8rem;
            cursor: pointer;
            margin-left: 8px;
            font-weight: bold;
            white-space: nowrap;
        }
        .btn-mini:active { background: #F44336; color: white; }

        /* Likely-on-Test Focus */
        .focus-box {
            margin-top: 10px;
            padding: 15px;
            background: #fff8e1;
            border: 1px solid #FFE08A;
            border-radius: 8px;
        }
        .focus-coverage { font-size: 0.85rem; color: #6b5900; margin-bottom: 10px; line-height: 1.4; }
        .focus-score-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 6px;
        }
        .focus-score { font-size: 1.05rem; font-weight: bold; }
        .focus-item {
            display: flex;
            gap: 8px;
            padding: 8px 0;
            border-top: 1px solid #f0e2b8;
            font-size: 0.9rem;
            line-height: 1.35;
        }
        .focus-mark { font-weight: bold; flex-shrink: 0; }
        .focus-mark.ok { color: #2e7d32; }
        .focus-mark.no { color: #c62828; }
        .focus-qtext { flex: 1; }
        .focus-ans { display: block; color: #555; font-size: 0.82rem; margin-top: 2px; }

        /* Missed-Question Review */
        .review-item { padding: 12px 0; border-bottom: 1px solid #eee; }
        .review-q { font-weight: bold; margin-bottom: 6px; line-height: 1.35; }
        .review-line { font-size: 0.9rem; margin: 2px 0; }
        .review-correct { color: #2e7d32; }
        .review-chosen { color: #c62828; }
        .review-exp { color: #555; font-size: 0.88rem; margin-top: 5px; font-style: italic; }

        /* Only apply hover effects on real pointing devices (not touch) */
        @media (hover: hover) and (pointer: fine) {
            .btn-large:hover { background: #0056b3; color: white; }
            .btn-highlight:hover { background: #004494; }
            .link-btn:hover { color: #666; }
            .option:not(.answered):hover { background: #f0f0f0; }
            .btn-next:hover { background: #004494; }
            .btn-secondary:hover { background: #eee; }
            .btn-mini:hover { background: #F44336; color: white; }
        }

        /* Phone layout */
        @media (max-width: 640px) {
            body { padding: 12px; padding-bottom: max(12px, env(safe-area-inset-bottom)); }
            .quiz-container { padding: 20px 16px; border-radius: 10px; }
            h1 { font-size: 1.35rem; }
            .splash-desc { font-size: 1rem; margin-bottom: 24px; }
            .btn-large { font-size: 1rem; }
            .question { font-size: 1.1rem; }
            .score-header { font-size: 1.35rem; }
        }
    </style>
</head>
<body>

<div class="quiz-container">
    <h1>SOS Practice Test</h1>

    <!-- Splash Screen -->
    <div id="splash-screen">
        <p class="splash-desc">Select your practice mode to begin.</p>

        <button class="btn-large" onclick="startQuiz(15, 'Quick Review')">Quick Review (15 Questions)</button>
        <div class="best-label" data-mode="Quick Review"></div>

        <button class="btn-large" onclick="startQuiz(55, 'Half Exam')">Half Exam (55 Questions)</button>
        <div class="best-label" data-mode="Half Exam"></div>

        <button class="btn-large" onclick="startQuiz(111, 'Full Simulation')">Full Simulation (All 111 Questions)</button>
        <div class="best-label" data-mode="Full Simulation"></div>

        <button class="btn-large btn-highlight" onclick="startMockTest()">SOS Mock Test (80 Questions)</button>
        <div class="best-label" data-mode="SOS Mock Test"></div>

        <div class="splash-tools">
            <button class="link-btn" id="reset-progress-btn">Reset saved progress</button>
        </div>
    </div>

    <!-- Progress Bar -->
    <div id="progress-section">
        <div class="progress-text" id="progress-text">Question 1 of X</div>
        <div class="progress-bar-container">
            <div class="progress-bar-fill" id="progress-fill"></div>
        </div>
    </div>

    <!-- Question Block -->
    <div id="quiz-block">
        <div class="question" id="question-text">Loading question...</div>
        <div class="options" id="options-container"></div>
        <div class="explanation-box" id="explanation-box"></div>
        <button class="btn-next" id="next-btn">Next Question</button>
        <button class="btn-secondary" id="finish-early-btn">Finish &amp; Rate Me</button>
    </div>

    <!-- Score Board -->
    <div id="score-board">
        <div class="score-header">Test Complete!</div>
        <div style="text-align: center; font-size: 1.2rem; margin-bottom: 10px;">
            Overall Score: <span id="score">0</span> / <span id="total">0</span> (<span id="score-percent">0</span>%)
        </div>
        <div id="result-message" style="text-align: center; font-size: 1.1rem; font-weight: bold; margin-bottom: 10px;"></div>
        <div id="best-message" style="text-align: center; font-size: 0.9rem; color: #666; margin-bottom: 10px;"></div>

        <h3 class="section-heading">⭐ Likely-on-Test Focus</h3>
        <div class="focus-box" id="focus-box"></div>

        <h3 class="section-heading">Study Areas Breakdown</h3>
        <div class="stats-container" id="stats-container">
            <!-- Dynamic stats will populate here -->
        </div>

        <div id="review-section">
            <h3 class="section-heading">Review Your Missed Questions</h3>
            <div id="review-container"></div>
        </div>

        <button class="btn-next" id="restart-btn" style="display: block; margin-top: 30px;">Return to Main Menu</button>
    </div>
</div>

<!-- Question bank (separate file — edit questions here, not in the app logic) -->
<script src="questions.js"></script>
<script>
    // Pass threshold (per son's Driver's Ed class = 70%)
    const PASS_THRESHOLD = 70;

    // ---- Persistent progress (localStorage) ----
    const STORAGE_KEY = 'sosPracticeProgress';
    function loadProgress() {
        try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }
        catch (e) { return {}; }
    }
    function saveProgress() {
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(progress)); }
        catch (e) { /* storage unavailable (private mode, etc.) — app still works */ }
    }
    let progress = loadProgress();
    progress.missed = progress.missed || {}; // question id -> times missed
    progress.best = progress.best || {};     // mode label -> best percent

    function missCount(q) { return progress.missed[q.id] || 0; }

    // ---- Tracking objects ----
    let activeQuizData = [];
    let currentQuestionIndex = 0;
    let results = [];           // { q, chosen, correct } for every answered question
    let currentModeLabel = '';

    // ---- DOM Elements ----
    const splashScreen = document.getElementById('splash-screen');
    const questionText = document.getElementById('question-text');
    const optionsContainer = document.getElementById('options-container');
    const explanationBox = document.getElementById('explanation-box');
    const nextBtn = document.getElementById('next-btn');
    const finishEarlyBtn = document.getElementById('finish-early-btn');
    const progressText = document.getElementById('progress-text');
    const progressFill = document.getElementById('progress-fill');
    const progressSection = document.getElementById('progress-section');
    const quizBlock = document.getElementById('quiz-block');
    const scoreBoard = document.getElementById('score-board');
    const focusBox = document.getElementById('focus-box');
    const statsContainer = document.getElementById('stats-container');
    const reviewSection = document.getElementById('review-section');
    const reviewContainer = document.getElementById('review-container');
    const restartBtn = document.getElementById('restart-btn');

    // ---- Array Shuffling (Fisher-Yates) ----
    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    // ---- Confetti Effect (pure canvas, no dependencies) ----
    function launchConfetti() {
        const canvas = document.createElement('canvas');
        canvas.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:9999;';
        document.body.appendChild(canvas);
        const ctx = canvas.getContext('2d');
        const resize = () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; };
        resize();
        window.addEventListener('resize', resize);

        const colors = ['#4CAF50', '#0056b3', '#F44336', '#FFC107', '#9C27B0', '#00BCD4'];
        const pieces = [];
        for (let i = 0; i < 160; i++) {
            pieces.push({
                x: Math.random() * canvas.width,
                y: Math.random() * -canvas.height,
                w: 6 + Math.random() * 6,
                h: 8 + Math.random() * 8,
                color: colors[Math.floor(Math.random() * colors.length)],
                rot: Math.random() * Math.PI * 2,
                vr: (Math.random() - 0.5) * 0.2,
                vy: 2 + Math.random() * 3,
                vx: (Math.random() - 0.5) * 2,
                sway: Math.random() * Math.PI * 2
            });
        }

        const duration = 4000;
        const start = performance.now();
        function frame(now) {
            const elapsed = now - start;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            pieces.forEach(p => {
                p.y += p.vy;
                p.sway += 0.05;
                p.x += p.vx + Math.sin(p.sway) * 1.2;
                p.rot += p.vr;
                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.rotate(p.rot);
                ctx.globalAlpha = elapsed > duration - 1000 ? Math.max(0, (duration - elapsed) / 1000) : 1;
                ctx.fillStyle = p.color;
                ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
                ctx.restore();
            });
            if (elapsed < duration) {
                requestAnimationFrame(frame);
            } else {
                window.removeEventListener('resize', resize);
                canvas.remove();
            }
        }
        requestAnimationFrame(frame);
    }

    // ---- Shared setup for showing the quiz view ----
    function beginSession(label) {
        currentQuestionIndex = 0;
        results = [];
        currentModeLabel = label;

        splashScreen.style.display = 'none';
        quizBlock.style.display = 'block';
        progressSection.style.display = 'block';
        scoreBoard.style.display = 'none';
        finishEarlyBtn.style.display = 'none';
        window.scrollTo(0, 0);

        loadQuestion();
    }

    // ---- Standard Quiz Launch ----
    function startQuiz(numQuestions, label) {
        shuffleArray(masterQuizData);
        activeQuizData = masterQuizData.slice(0, numQuestions);
        beginSession(label);
    }

    // ---- Mock Test Launch (80 Qs; prioritizes starred + previously-missed) ----
    function startMockTest() {
        const weighted = (q) => missCount(q) + Math.random();

        let starredQs = masterQuizData.filter(q => q.starred).sort((a, b) => weighted(b) - weighted(a));
        let regularQs = masterQuizData.filter(q => !q.starred).sort((a, b) => weighted(b) - weighted(a));

        let mockData;
        if (starredQs.length >= 80) {
            mockData = starredQs.slice(0, 80);
        } else {
            mockData = starredQs.concat(regularQs.slice(0, 80 - starredQs.length));
        }

        shuffleArray(mockData);
        activeQuizData = mockData;
        beginSession('SOS Mock Test');
    }

    // ---- Targeted Category Mini-Test Launch ----
    function startCategoryQuiz(category) {
        let categoryData = masterQuizData.filter(q => q.category === category);
        shuffleArray(categoryData);
        activeQuizData = categoryData.slice(0, 5);
        beginSession('Review: ' + category);
    }

    // ---- Render one question (with shuffled answer options) ----
    function loadQuestion() {
        nextBtn.style.display = 'none';
        finishEarlyBtn.style.display = 'none';
        explanationBox.style.display = 'none';
        explanationBox.innerHTML = '';

        const currentQ = activeQuizData[currentQuestionIndex];

        questionText.textContent = currentQ.question;
        progressText.textContent = `Question ${currentQuestionIndex + 1} of ${activeQuizData.length}`;

        const progressPercentage = (currentQuestionIndex / activeQuizData.length) * 100;
        progressFill.style.width = `${progressPercentage}%`;

        // Shuffle the display order of the options each time.
        const order = currentQ.options.map((_, i) => i);
        shuffleArray(order);

        optionsContainer.innerHTML = '';
        order.forEach(origIndex => {
            const div = document.createElement('div');
            div.className = 'option';
            div.dataset.orig = origIndex;
            div.textContent = currentQ.options[origIndex];
            div.onclick = () => selectOption(div, origIndex, currentQ);
            optionsContainer.appendChild(div);
        });
    }

    function selectOption(selectedDiv, chosenIndex, q) {
        const allOptions = optionsContainer.children;
        for (let i = 0; i < allOptions.length; i++) {
            allOptions[i].onclick = null;
            allOptions[i].classList.add('answered');
            if (Number(allOptions[i].dataset.orig) === q.answer) {
                allOptions[i].classList.add('correct');
            }
        }

        const isCorrect = chosenIndex === q.answer;
        if (!isCorrect) {
            selectedDiv.classList.add('wrong');
            progress.missed[q.id] = missCount(q) + 1;
            saveProgress();
        }

        results.push({ q: q, chosen: chosenIndex, correct: isCorrect });

        // Show the explanation.
        if (q.explanation) {
            explanationBox.innerHTML = `<strong>${isCorrect ? 'Correct! ' : 'Answer: '}</strong>${q.explanation}`;
            explanationBox.style.display = 'block';
        }

        nextBtn.style.display = 'block';
        finishEarlyBtn.style.display = 'block';
    }

    nextBtn.onclick = () => {
        currentQuestionIndex++;
        if (currentQuestionIndex < activeQuizData.length) {
            loadQuestion();
            window.scrollTo(0, 0);
        } else {
            showScore();
        }
    };

    finishEarlyBtn.onclick = () => {
        showScore();
    };

    function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    function showScore() {
        progressFill.style.width = '100%';
        quizBlock.style.display = 'none';
        progressSection.style.display = 'none';
        scoreBoard.style.display = 'block';
        finishEarlyBtn.style.display = 'none';
        window.scrollTo(0, 0);

        // Derive everything from the results list.
        const totalAnswered = results.length;
        const score = results.filter(r => r.correct).length;

        document.getElementById('score').textContent = score;
        document.getElementById('total').textContent = totalAnswered;

        const percent = totalAnswered > 0 ? Math.round((score / totalAnswered) * 100) : 0;
        document.getElementById('score-percent').textContent = percent;

        // Pass / fail message + confetti.
        const resultMsg = document.getElementById('result-message');
        if (percent >= PASS_THRESHOLD) {
            resultMsg.textContent = `🎉 You Passed! (${PASS_THRESHOLD}% needed)`;
            resultMsg.style.color = '#4CAF50';
            launchConfetti();
        } else {
            resultMsg.textContent = `Keep practicing — ${PASS_THRESHOLD}% needed to pass.`;
            resultMsg.style.color = '#F44336';
        }

        // Best-score tracking (per mode).
        const bestMsg = document.getElementById('best-message');
        const prevBest = progress.best[currentModeLabel];
        if (prevBest == null || percent > prevBest) {
            progress.best[currentModeLabel] = percent;
            saveProgress();
            bestMsg.textContent = (prevBest == null)
                ? `Best for "${currentModeLabel}": ${percent}%`
                : `New best for "${currentModeLabel}"! (was ${prevBest}%)`;
        } else {
            bestMsg.textContent = `Best for "${currentModeLabel}": ${prevBest}%`;
        }

        // ---- Likely-on-Test Focus summary ----
        const starredResults = results.filter(r => r.q.starred);
        const totalStarredInBank = masterQuizData.filter(q => q.starred).length;
        focusBox.innerHTML = '';
        if (starredResults.length === 0) {
            focusBox.innerHTML = `<div class="focus-coverage">None of the ${totalStarredInBank} questions flagged as likely on the official test came up this round. Try the SOS Mock Test to focus on them.</div>`;
        } else {
            const sCorrect = starredResults.filter(r => r.correct).length;
            const sPercent = Math.round((sCorrect / starredResults.length) * 100);
            const badgeClass = sPercent >= PASS_THRESHOLD ? 'badge-good' : 'badge-review';
            const badgeText = sPercent >= PASS_THRESHOLD ? 'On Track' : 'Needs Review';

            let html = `<div class="focus-coverage">This round included <strong>${starredResults.length}</strong> of the <strong>${totalStarredInBank}</strong> questions flagged as likely on the official test.</div>`;
            html += `<div class="focus-score-row"><span class="focus-score">${sCorrect} / ${starredResults.length} correct (${sPercent}%)</span><span class="stat-badge ${badgeClass}">${badgeText}</span></div>`;
            starredResults.forEach(r => {
                const mark = r.correct ? '<span class="focus-mark ok">✓</span>' : '<span class="focus-mark no">✗</span>';
                const wrongAns = r.correct ? '' : `<span class="focus-ans">You answered: ${escapeHtml(r.q.options[r.chosen])}</span>`;
                html += `<div class="focus-item">${mark}<div class="focus-qtext">${escapeHtml(r.q.question)}<span class="focus-ans">Answer: ${escapeHtml(r.q.options[r.q.answer])}</span>${wrongAns}</div></div>`;
            });
            focusBox.innerHTML = html;
        }

        // ---- Category breakdown ----
        const categoryStats = {};
        results.forEach(r => {
            const c = r.q.category;
            if (!categoryStats[c]) categoryStats[c] = { correct: 0, total: 0 };
            categoryStats[c].total++;
            if (r.correct) categoryStats[c].correct++;
        });

        statsContainer.innerHTML = '';
        for (const [category, stats] of Object.entries(categoryStats)) {
            const percentage = stats.total > 0 ? Math.round((stats.correct / stats.total) * 100) : 0;
            const badgeClass = percentage >= PASS_THRESHOLD ? 'badge-good' : 'badge-review';
            const badgeText = percentage >= PASS_THRESHOLD ? 'Great Job' : 'Needs Review';

            let reviewButtonHTML = '';
            if (percentage < PASS_THRESHOLD) {
                reviewButtonHTML = `<button class="btn-mini" onclick="startCategoryQuiz('${category.replace(/'/g, "\\'")}')">Practice 5 Qs</button>`;
            }

            const statRow = document.createElement('div');
            statRow.className = 'stat-row';
            statRow.innerHTML = `
                <div>
                    <div class="stat-category">${category}</div>
                    <div style="color: #666; font-size: 0.8rem;">${stats.correct} / ${stats.total} correct (${percentage}%)</div>
                </div>
                <div style="display: flex; align-items: center;">
                    <div class="stat-badge ${badgeClass}">${badgeText}</div>
                    ${reviewButtonHTML}
                </div>
            `;
            statsContainer.appendChild(statRow);
        }

        // ---- Missed-question review ----
        const missed = results.filter(r => !r.correct);
        reviewContainer.innerHTML = '';
        if (missed.length === 0) {
            reviewSection.style.display = 'none';
        } else {
            reviewSection.style.display = 'block';
            missed.forEach(({ q, chosen }) => {
                const item = document.createElement('div');
                item.className = 'review-item';
                const expHTML = q.explanation ? `<div class="review-exp">${escapeHtml(q.explanation)}</div>` : '';
                item.innerHTML = `
                    <div class="review-q">${q.starred ? '⭐ ' : ''}${escapeHtml(q.question)}</div>
                    <div class="review-line review-chosen">Your answer: ${escapeHtml(q.options[chosen])}</div>
                    <div class="review-line review-correct">Correct answer: ${escapeHtml(q.options[q.answer])}</div>
                    ${expHTML}
                `;
                reviewContainer.appendChild(item);
            });
        }
    }

    restartBtn.onclick = () => {
        scoreBoard.style.display = 'none';
        splashScreen.style.display = 'block';
        renderSplashBests();
        window.scrollTo(0, 0);
    };

    // ---- Splash best-score labels ----
    function renderSplashBests() {
        document.querySelectorAll('.best-label[data-mode]').forEach(el => {
            const b = progress.best[el.dataset.mode];
            el.textContent = (b != null) ? `Best: ${b}%` : '';
        });
    }

    document.getElementById('reset-progress-btn').onclick = () => {
        if (confirm('Clear saved best scores and missed-question history on this device?')) {
            progress = { missed: {}, best: {} };
            saveProgress();
            renderSplashBests();
        }
    };

    // ---- Data validator (dev aid; logs to console, never blocks the app) ----
    function validateQuestions() {
        const issues = [];
        const seenIds = new Set();
        masterQuizData.forEach((q, i) => {
            const where = `#${i} (${q.id || 'no-id'})`;
            if (!q.id) issues.push(`${where}: missing id`);
            else if (seenIds.has(q.id)) issues.push(`${where}: duplicate id`);
            else seenIds.add(q.id);
            if (!q.question) issues.push(`${where}: missing question text`);
            if (!Array.isArray(q.options) || q.options.length !== 4) issues.push(`${where}: expected 4 options`);
            if (typeof q.answer !== 'number' || q.answer < 0 || q.answer > 3) issues.push(`${where}: answer out of range`);
            if (!q.explanation) issues.push(`${where}: missing explanation`);
        });
        if (issues.length) {
            console.warn(`[SOS quiz] ${issues.length} data issue(s):\n` + issues.join('\n'));
        } else {
            console.info(`[SOS quiz] ${masterQuizData.length} questions loaded, all valid.`);
        }
    }

    // ---- Init ----
    validateQuestions();
    renderSplashBests();
</script>
</body>
</html>
