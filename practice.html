        { category: "Signs & Signals", question: "What does a solid yellow light mean?", options: ["Speed up", "The light will be red soon", "Yield to traffic", "Stop immediately"], answer: 1 },
        { category: "Signs & Signals", question: "When facing a solid green light, proceed with caution and look:", options: ["left only", "right only", "left, right, left", "straight ahead"], answer: 2 },
        { category: "Signs & Signals", question: "When stopped for a red signal, you should check for ____ before moving when the light turns green.", options: ["potholes", "trafic", "cops", "signs"], answer: 1 },
        { category: "Signs & Signals", question: "If there is any traffic in the ____, wait until it is clear before proceeding on a green light.", options: ["crosswalk", "intersection", "turning lane", "shoulder"], answer: 1 },
        { category: "Signs & Signals", question: "If a traffic signal has been green for a while, expect it to turn ____ soon.", options: ["red", "flashing yellow", "yellow", "off"], answer: 2 },
        { category: "Signs & Signals", question: "What does a flashing red light mean?", options: ["Yield to oncoming traffic", "It is like a stop sign; stop behind the line", "Slow down and proceed with caution", "The intersection is closed"], answer: 1 },
        { category: "Signs & Signals", question: "If all four directions have a flashing red light, treat it like a four way:", options: ["yield", "stop sign", "intersection", "green light"], answer: 1 },
        { category: "Signs & Signals", question: "What does a flashing yellow light mean?", options: ["Stop immediately", "Slow down and proceed with caution", "The light will turn red soon", "Yield to all pedestrians only"], answer: 1 },
        { category: "Signs & Signals", question: "You may turn right on red after you come to a complete stop, yield to pedestrians and traffic, and:", options: ["honk your horn", "make sure there is no sign prohibiting the turn", "flash your headlights", "shift into neutral"], answer: 1 },
        { category: "Signs & Signals", question: "A Police Officer is directing traffic and waves you through an intersection. Follow their signal regardless of the:", options: ["trafic signal", "speed limit", "pedestrians", "lane markings"], answer: 0 },
        { category: "Signs & Signals", question: "A solid green arrow means you may proceed in the arrow's direction, but you must still yield to other ____ and ____ if any.", options: ["cars / trucks", "trafic / pedestrians", "bikes / motorcycles", "signals / signs"], answer: 1 },
        { category: "Signs & Signals", question: "* What does a Flashing Yellow Arrow mean?", options: ["Stop immediately", "Time to claim the intersection", "You must go straight only", "The signal is broken"], answer: 1 },
        { category: "Signs & Signals", question: "A flashing yellow arrow allows drivers to ____ down and if the intersection is ____ to proceed.", options: ["speed / open", "slow / clear", "stop / empty", "coast / safe"], answer: 1 },
        { category: "Signs & Signals", question: "If a traffic signal is not working at an intersection, what should you do?", options: ["Follow the car in front of you", "Honk your horn and proceed", "Come to a complete stop, then proceed when it is safe", "Treat it as a yield sign"], answer: 2 },
        { category: "Signs & Signals", question: "Solid white lines indicate traffic is moving in the ____.", options: ["opposite direction", "same direction", "center lane", "HOV lane"], answer: 1 }
    ];

    // Tracking objects
    let activeQuizData = []; 
    let currentQuestionIndex = 0;
    let score = 0;
    let totalAnswered = 0; 
    let categoryStats = {};

    // DOM Elements
    const splashScreen = document.getElementById('splash-screen');
    const questionText = document.getElementById('question-text');
    const optionsContainer = document.getElementById('options-container');
    const nextBtn = document.getElementById('next-btn');
    const finishEarlyBtn = document.getElementById('finish-early-btn');
    const progressText = document.getElementById('progress-text');
    const progressFill = document.getElementById('progress-fill');
    const progressSection = document.getElementById('progress-section');
    const quizBlock = document.getElementById('quiz-block');
    const scoreBoard = document.getElementById('score-board');
    const statsContainer = document.getElementById('stats-container');
    const restartBtn = document.getElementById('restart-btn');

    // Array Shuffling Function
    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
    }

    // Standard Quiz Launch
    function startQuiz(numQuestions) {
        currentQuestionIndex = 0;
        score = 0;
        totalAnswered = 0;
        categoryStats = {}; 
        
        shuffleArray(masterQuizData);
        activeQuizData = masterQuizData.slice(0, numQuestions);

        splashScreen.style.display = 'none';
        quizBlock.style.display = 'block';
        progressSection.style.display = 'block';
        scoreBoard.style.display = 'none';
        finishEarlyBtn.style.display = 'none';
        
        loadQuestion();
    }

    // Mock Test Launch (80 Qs, prioritizes asterisks)
    function startMockTest() {
        currentQuestionIndex = 0;
        score = 0;
        totalAnswered = 0;
        categoryStats = {}; 
        
        // Split data into starred and regular
        let starredQs = masterQuizData.filter(q => q.question.includes('*'));
        let regularQs = masterQuizData.filter(q => !q.question.includes('*'));
        
        shuffleArray(starredQs);
        shuffleArray(regularQs);
        
        let mockData = [];
        
        if (starredQs.length >= 80) {
            mockData = starredQs.slice(0, 80);
        } else {
            let remainingNeeded = 80 - starredQs.length;
            mockData = starredQs.concat(regularQs.slice(0, remainingNeeded));
        }
        
        // Shuffle the final combined list so asterisks are mixed in
        shuffleArray(mockData);
        activeQuizData = mockData;
        
        splashScreen.style.display = 'none';
        quizBlock.style.display = 'block';
        progressSection.style.display = 'block';
        scoreBoard.style.display = 'none';
        finishEarlyBtn.style.display = 'none';
        
        loadQuestion();
    }

    // Targeted Category Mini-Test Launch
    function startCategoryQuiz(category) {
        currentQuestionIndex = 0;
        score = 0;
        totalAnswered = 0;
        categoryStats = {}; 
        
        let categoryData = masterQuizData.filter(q => q.category === category);
        shuffleArray(categoryData);
        
        activeQuizData = categoryData.slice(0, 5);

        scoreBoard.style.display = 'none';
        quizBlock.style.display = 'block';
        progressSection.style.display = 'block';
        finishEarlyBtn.style.display = 'none';
        
        loadQuestion();
    }

    function loadQuestion() {
        nextBtn.style.display = 'none';
        const currentQ = activeQuizData[currentQuestionIndex];
        
        questionText.textContent = currentQ.question;
        progressText.textContent = `Question ${currentQuestionIndex + 1} of ${activeQuizData.length}`;
        
        const progressPercentage = ((currentQuestionIndex) / activeQuizData.length) * 100;
        progressFill.style.width = `${progressPercentage}%`;

        optionsContainer.innerHTML = '';
        currentQ.options.forEach((option, index) => {
            const div = document.createElement('div');
            div.className = 'option';
            div.textContent = option;
            div.onclick = () => selectOption(div, index, currentQ.answer, currentQ.category);
            optionsContainer.appendChild(div);
        });
    }

    function selectOption(selectedDiv, selectedIndex, correctIndex, category) {
        const allOptions = optionsContainer.children;
        for (let i = 0; i < allOptions.length; i++) {
            allOptions[i].onclick = null; 
            if (i === correctIndex) {
                allOptions[i].classList.add('correct');
            }
        }

        if (!categoryStats[category]) {
            categoryStats[category] = { correct: 0, total: 0 };
        }
        categoryStats[category].total++;

        if (selectedIndex === correctIndex) {
            score++;
            categoryStats[category].correct++;
        } else {
            selectedDiv.classList.add('wrong');
        }

        totalAnswered++;
        nextBtn.style.display = 'block';
        finishEarlyBtn.style.display = 'block'; 
    }

    nextBtn.onclick = () => {
        currentQuestionIndex++;
        if (currentQuestionIndex < activeQuizData.length) {
            loadQuestion();
        } else {
            showScore();
        }
    };

    finishEarlyBtn.onclick = () => {
        showScore();
    };

    function showScore() {
        progressFill.style.width = '100%';
        quizBlock.style.display = 'none';
        progressSection.style.display = 'none';
        scoreBoard.style.display = 'block';
        finishEarlyBtn.style.display = 'none';
        
        document.getElementById('score').textContent = score;
        document.getElementById('total').textContent = totalAnswered; 
        
        const percent = totalAnswered > 0 ? Math.round((score / totalAnswered) * 100) : 0;
        document.getElementById('score-percent').textContent = percent;

        statsContainer.innerHTML = '';
        
        for (const [category, stats] of Object.entries(categoryStats)) {
            const percentage = stats.total > 0 ? Math.round((stats.correct / stats.total) * 100) : 0;
            
            let badgeClass = percentage >= 70 ? 'badge-good' : 'badge-review';
            let badgeText = percentage >= 70 ? 'Great Job' : 'Needs Review';
            
            let reviewButtonHTML = '';
            if (percentage < 70) {
                reviewButtonHTML = `<button class="btn-mini" onclick="startCategoryQuiz('${category}')">Practice 5 Qs</button>`;
            }

            const statRow = document.createElement('div');
            statRow.className = 'stat-row';
            statRow.innerHTML = `
                <div>
                    <div class="stat-category">${category}</div>
                    <div style="color: #666; font-size: 0.8rem;">${stats.correct} / ${stats.total} correct (${percentage}%)</div>
                </div>
                <div style="display: flex; align-items: center;">
                    <div class="stat-badge ${badgeClass}">${badgeText}</div>
                    ${reviewButtonHTML}
                </div>
            `;
            statsContainer.appendChild(statRow);
        }
    }

    restartBtn.onclick = () => {
        scoreBoard.style.display = 'none';
        splashScreen.style.display = 'block';
    };

</script>
</body>
</html>
