<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Michigan SOS Practice Test</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
            background: #f4f7f6; 
            color: #333; 
            display: flex; 
            justify-content: center; 
            padding: 20px; 
        }
        .quiz-container { 
            background: white; 
            padding: 30px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
            max-width: 600px; 
            width: 100%; 
        }
        h1 { font-size: 1.5rem; text-align: center; margin-bottom: 10px; }
        .progress-text { 
            text-align: center; 
            color: #666; 
            margin-bottom: 10px; 
            font-size: 0.9rem; 
        }
        .progress-bar-container {
            width: 100%;
            height: 10px;
            background-color: #e0e0e0;
            border-radius: 5px;
            margin-bottom: 25px;
            overflow: hidden;
        }
        .progress-bar-fill {
            height: 100%;
            background-color: #4CAF50;
            width: 0%;
            transition: width 0.3s ease;
        }
        .question { font-size: 1.2rem; font-weight: bold; margin-bottom: 15px; }
        .options { display: flex; flex-direction: column; gap: 10px; }
        .option { 
            padding: 12px 15px; 
            border: 2px solid #e0e0e0; 
            border-radius: 8px; 
            cursor: pointer; 
            transition: all 0.2s; 
        }
        .option:hover { background: #f0f0f0; }
        .option.correct { border-color: #4CAF50; background: #e8f5e9; }
        .option.wrong { border-color: #F44336; background: #ffebee; }
        .btn { 
            background: #0056b3; 
            color: white; 
            border: none; 
            padding: 12px 20px; 
            border-radius: 8px; 
            font-size: 1rem; 
            cursor: pointer; 
            margin-top: 20px; 
            width: 100%; 
            display: none; 
        }
        .btn:hover { background: #004494; }
        .score-board { text-align: center; font-size: 1.5rem; display: none; }
    </style>
</head>
<body>

<div class="quiz-container">
    <h1>SOS Practice Test</h1>
    
    <div id="progress-section">
        <div class="progress-text" id="progress-text">Question 1 of 3</div>
        <div class="progress-bar-container">
            <div class="progress-bar-fill" id="progress-fill"></div>
        </div>
    </div>

    <div id="quiz-block">
        <div class="question" id="question-text">Loading question...</div>
        <div class="options" id="options-container"></div>
        <button class="btn" id="next-btn">Next Question</button>
    </div>
    
    <div class="score-board" id="score-board">
        <p>You scored <span id="score">0</span> out of <span id="total">0</span>!</p>
        <button class="btn" id="restart-btn" style="display: block;">Restart Quiz</button>
    </div>
</div>

<script>

        // --- PAGE 2 ---

        {

        {

        {

        {

                "sliding",

        },
        {

        },
        {

        {

        // --- PAGE 3 ---

            options: [

        {

        {

            options: [
                "The steering wheel will lock",

            ],
            answer: 2
        },
        {
            question: "What does it mean if your temperature light comes on when you are driving?",
            options: [
                "The heater is on",

                "The engine temp level is not safe",
                "The air conditioning is failing"
            ],
            answer: 2
        },
        {
            question: "What is the #1 safety device?",
            options: [
                "Air bags",
                "Anti-lock brakes",
                "Seat belts",
                "Head restraints"
            ],
            answer: 2
        },
        {
            question: "Safety belts are designed to be used with what?",
            options: [
                "Air bags",
                "Car seats",
                "Emergency flashers",
                "Cruise control"
            ],
            answer: 0
        },
        {
            question: "How should you be seated to provide maximum protection?",
            options: [
                "Leaning slightly forward",
                "Straight up with your back firmly against the seat",
                "Reclined comfortably",
                "Shifted toward the center console"
            ],
            answer: 1
        },
        {
            question: "Correctly adjusted head restraints provide the most protection when a vehicle is struck from where?",
            options: [
                "The front",
                "The side",
                "The rear",
                "During a rollover"
            ],
            answer: 2
        },
        {
            question: "If the head restraint is properly adjusted, where should it be?",
            options: [
                "At the base of the neck",
                "In the middle of the person's head",
                "Above the top of the head",
                "Resting on the shoulders"
            ],
            answer: 1
        },
        {
            question: "If you are properly seated, the top of the steering wheel should be no higher than?",
            options: [
                "Your chin",
                "Your eyes",
                "The top of your shoulders",
                "Your chest"
            ],
            answer: 2
        },
        {
            question: "When driving a vehicle with airbags, what is the recommended distance you should be from the steering wheel?",
            options: [
                "Minimum 5\" away",
                "Minimum 10\" away",
                "Minimum 15\" away",
                "Minimum 20\" away"
            ],
            answer: 1
        },
        {
            question: "If your steering wheel has an airbag, where should your hands be positioned?",
            options: [
                "10 and 2",
                "8 and 4",
                "9 and 3",
                "12 and 6"
            ],
            answer: 2
        }
    ];

    // App Logic
    let currentQuestionIndex = 0;
    let score = 0;

    const questionText = document.getElementById('question-text');
    const optionsContainer = document.getElementById('options-container');
    const nextBtn = document.getElementById('next-btn');
    const progressText = document.getElementById('progress-text');
    const progressFill = document.getElementById('progress-fill');
    const progressSection = document.getElementById('progress-section');
    const quizBlock = document.getElementById('quiz-block');
    const scoreBoard = document.getElementById('score-board');
    const scoreSpan = document.getElementById('score');
    const totalSpan = document.getElementById('total');
    const restartBtn = document.getElementById('restart-btn');

    function loadQuestion() {
        nextBtn.style.display = 'none';
        const currentQ = quizData[currentQuestionIndex];
        
        // Update Text
        questionText.textContent = currentQ.question;
        progressText.textContent = `Question ${currentQuestionIndex + 1} of ${quizData.length}`;
        
        // Update Progress Bar
        const progressPercentage = ((currentQuestionIndex) / quizData.length) * 100;
        progressFill.style.width = `${progressPercentage}%`;

        // Clear and load options
        optionsContainer.innerHTML = '';
        currentQ.options.forEach((option, index) => {
            const div = document.createElement('div');
            div.className = 'option';
            div.textContent = option;
            div.onclick = () => selectOption(div, index, currentQ.answer);
            optionsContainer.appendChild(div);
        });
    }

    function selectOption(selectedDiv, selectedIndex, correctIndex) {
        // Disable clicking once an answer is chosen
        const allOptions = optionsContainer.children;
        for (let i = 0; i < allOptions.length; i++) {
            allOptions[i].onclick = null;
            if (i === correctIndex) {
                allOptions[i].classList.add('correct');
            }
        }

        if (selectedIndex === correctIndex) {
            score++;
        } else {
            selectedDiv.classList.add('wrong');
        }

        nextBtn.style.display = 'block';
    }

    nextBtn.onclick = () => {
        currentQuestionIndex++;
        if (currentQuestionIndex < quizData.length) {
            loadQuestion();
        } else {
            showScore();
        }
    };

    function showScore() {
        // Fill the bar completely when finished
        progressFill.style.width = '100%';
        
        quizBlock.style.display = 'none';
        progressText.textContent = "Quiz Complete!";
        scoreBoard.style.display = 'block';
        scoreSpan.textContent = score;
        totalSpan.textContent = quizData.length;
    }

    restartBtn.onclick = () => {
        currentQuestionIndex = 0;
        score = 0;
        quizBlock.style.display = 'block';
        scoreBoard.style.display = 'none';
        loadQuestion();
    };

    // Start the app
    loadQuestion();
</script>
</body>
</html>
