<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Robert Beier</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root { --bg: #ffffff; --text: #333333; --link: #5D3FD3; --border: #eeeeee; }
    [data-theme="dark"] { --bg: #1a1a1a; --text: #f0f0f0; --link: #a389f4; --border: #333333; }
    body { background-color: var(--bg); color: var(--text); font-family: -apple-system, sans-serif; max-width: 800px; margin: 0 auto; padding: 2rem; }
    nav { margin-bottom: 2rem; border-bottom: 1px solid var(--border); padding-bottom: 1rem; display: flex; justify-content: space-between; }
    a { color: var(--link); text-decoration: none; font-weight: bold; }
    #theme-toggle { background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 5px 12px; border-radius: 20px; cursor: pointer; }
  </style>
</head>
<body>
<nav>
  <div>
    <a href="/">Home</a>
  </div>
  <button id="theme-toggle">🌙 Dark Mode</button>
</nav>

{{ content }}

<script>
  const toggle = document.getElementById('theme-toggle');
  const setTheme = (t) => {
    document.documentElement.setAttribute('data-theme', t);
    toggle.textContent = t === 'dark' ? '☀️ Light Mode' : '🌙 Dark Mode';
    localStorage.setItem('theme', t);
  };
  if (localStorage.getItem('theme') === 'dark') setTheme('dark');
  toggle.onclick = () => {
    const current = document.documentElement.getAttribute('data-theme');
    setTheme(current === 'dark' ? 'light' : 'dark');
  };
</script>
</body>
</html>
