# Charging location coordinates for the EV Analytics map.
#
# The 'location' value must EXACTLY match the location strings in cloudcannon.config.yml.
# The map shows one pin per distinct location; color is derived automatically from the bucket
# (Tesla → purple, ChargePoint → blue, Home → purple, Work → blue, etc.).
#
# Fill in lat/lng (decimal degrees) to show a pin. Leave blank to hide that location.
# 'city' is optional — shown in the map popup subtitle.
#
# Add a new entry here whenever you add a new location to cloudcannon.config.yml.

# PRIVACY: private residences (Home, Work, friends' homes, Cabin) are coarsened
# to 2 decimals (~1 km) on purpose so the public map shows the general area but
# does not pinpoint an exact address. Do NOT restore full-precision coordinates
# for these. Public chargers (Tesla/EA/ChargePoint/etc.) keep exact coords.
