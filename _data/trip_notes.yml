# ─────────────────────────────────────────────────────────────────────────────
#  _data/trip_notes.yml  —  Road Trip Annotations
# ─────────────────────────────────────────────────────────────────────────────
#
#  The analytics page auto-detects road trips from your charging session data.
#  Use this file to add destination info, itinerary, notes, and energy screen
#  data captured from the Mach-E's "Where did my energy go?" trip computer.
#
#  HOW TO FIND A TRIP'S KEY:
#    Each trip is keyed by the date of its FIRST charging session (YYYY-MM-DD).
#    Look at the Road Trips section on the analytics page — the date range on
#    each card starts with the key date.
#
#  FIELDS:
#    key            REQUIRED. First session date: "YYYY-MM-DD"
#    destination    Short headline name for the trip.
#    arrive         Date you arrived at destination (YYYY-MM-DD).
#    depart         Date you departed destination (YYYY-MM-DD).
#    dest_lat       Decimal latitude of actual final destination.
#    dest_lng       Decimal longitude of actual final destination.
#    description    One-sentence summary shown on the card.
#    notes          Free-form notes (passengers, weather, hotel, etc.)
#    blog_tag       Future use — tag slug for blog posts about this trip.
#
#  TRIP COMPUTER DATA (from Mach-E "Where did my energy go?" screen):
#    energy_screen: true to indicate data was captured
#    trip_miles     Total odometer miles for the trip (from car screen)
#    trip_hours     Drive time as "HH:MM:SS" (from car screen)
#    trip_mi_per_kwh  Efficiency shown on car screen (e.g. 2.7)
#    energy_driving_pct    % of energy used for driving (e.g. 96)
#    energy_climate_pct    % for climate (HVAC) (e.g. 2)
#    energy_accessories_pct  % for accessories (e.g. 2)
#    energy_ext_temp_pct   % for exterior temperature conditioning (e.g. 0)
#    score_acceleration    Driving score 0-100 (e.g. 85)
#    score_deceleration    Driving score 0-100 (e.g. 99)
#    score_speed           Driving score 0-100 (e.g. 43)
#
#  HOW TO CAPTURE TRIP COMPUTER DATA:
#    At the end of a road trip, go to the car's energy screen (Trip 2 tab),
#    take a photo, then run the ⚡ Log Trip Energy shortcut (same Apple
#    Intelligence pattern as the charging shortcut). It extracts all fields
#    automatically and appends to this file via GitHub.
#    OR add the fields manually below.
#
#  itinerary: Optional chronological list of stops.
#             Each entry: date (YYYY-MM-DD), place, note.
#
#  ADD A NEW ENTRY: Copy the TEMPLATE block at the bottom, fill in, commit.
#
# ─────────────────────────────────────────────────────────────────────────────

