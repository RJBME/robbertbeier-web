# ─────────────────────────────────────────────────────────────────────────────
#  _data/trip_notes.yml  —  Road Trip Annotations
# ─────────────────────────────────────────────────────────────────────────────
#
#  The analytics page auto-detects road trips from your charging session data.
#  Use this file to add destination info, itinerary, and notes to each trip.
#
#  HOW TO FIND A TRIP'S KEY:
#    Each trip is keyed by the date of its FIRST charging session (YYYY-MM-DD).
#    Look at the Road Trips section — the date range on each card starts with
#    the key date. If two trips start on the same date, append -2, -3, etc.
#
#  FIELDS:
#    key            REQUIRED. First session date: "YYYY-MM-DD"
#    destination    Short headline name for the trip.
#    arrive         Date you arrived at the final destination (YYYY-MM-DD).
#    depart         Date you departed the final destination (YYYY-MM-DD).
#    dest_lat       Decimal latitude of actual final destination.
#    dest_lng       Decimal longitude of actual final destination.
#    description    One-sentence summary shown on the card.
#    notes          Free-form notes (passengers, weather, etc.)
#    blog_tag       Future use — tag slug for blog posts about this trip.
#                   e.g. "chicago-2026" will eventually link to /blog/tag/chicago-2026/
#    itinerary      Optional chronological list of stops.
#                   Each entry: date (YYYY-MM-DD), place, note.
#
#  HOW TO GET COORDINATES:
#    Right-click any location in Google Maps -> "What's here?" -> copy lat/lng.
#
#  ADD A NEW ENTRY: Copy the TEMPLATE block at the bottom, fill in, commit.
#
# ─────────────────────────────────────────────────────────────────────────────

